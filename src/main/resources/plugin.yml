name: CdrGPPatrol
version: '1.5.0'
main: id.menkiplugcore.cdrgppatrol.CdrGPPatrol
api-version: '1.21.10'
author: MenkiPlugcore
description: Administrative claim browser, inspector, border visualizer, owner status, abandoned scanner, and patrol addon for GriefPrevention.
depend: [GriefPrevention]

commands:
  gppatrol:
    description: Browse, search, filter, sort, inspect, visualize, and scan GriefPrevention claims.
    usage: /gppatrol [page|search|world|type|sort|abandoned|reset]
    permission: cdrgppatrol.admin
  gppatroldebug:
    description: Show GriefPrevention claim diagnostics.
    usage: /gppatroldebug
    permission: cdrgppatrol.admin

permissions:
  cdrgppatrol.admin:
    description: Allows access to CdrGPPatrol commands and GUI.
    default: op
